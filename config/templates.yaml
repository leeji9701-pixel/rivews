# ============================================================
# 답글 템플릿 & 분류 규칙
# 플랫폼이 답글 앞에 '000님,' 을 자동으로 붙이므로 본론부터 작성합니다.
# {order_count} 자리에는 고객의 주문 횟수가 들어갑니다.
# ============================================================

# 이 횟수 이상 주문한 고객에게는 'VIP 단골' 템플릿을 사용
vip_min_orders: 3

# 3~5점 + 클레임 키워드 없는 리뷰에 쓰는 템플릿
# 선택 순서: 단골(vip) -> 사진 리뷰(photo) -> 기본(default)
positive:
  vip: |-
    안녕하세요, 고객님! 101번지 남산돈까스 본점입니다.
    무려 {order_count}번째나 저희 매장을 잊지 않고 찾아주신 VIP 단골 고객님께 진심으로 감사드립니다! 보내주신 소중한 신뢰에 보답할 수 있도록 항상 기복 없이 최상의 맛과 품질로 준비하겠습니다. 늘 건강하시고 행복하세요!

  photo: |-
    101번지 남산돈까스 본점입니다.

    저희 매장을 이용해 주시고 소중한 리뷰와 사진까지 남겨주셔서 진심으로 감사드립니다.
    양도 맛도 만족스러운 식사가 되신 것 같아 다행입니다. 앞으로도 언제나 넉넉하고 변함없는 맛으로 보답하겠습니다.
    건강하고 즐거운 하루 보내시길 바랍니다!

  default: |-
    101번지 남산돈까스 본점입니다!

    배달도 빠르게 도착하고 따뜻하고 맛있게 드셨다니 정말 다행입니다. 😊
    정성스러운 소중한 리뷰 감사드리며, 앞으로도 변함없이 맛있는 돈까스로 보답하겠습니다. 즐거운 하루 되세요!

# 이 별점 이하는 자동 답글 없이 '확인 후 등록' (캡처 + 확인대기.xlsx)
manual_max_rating: 2

# 별점이 높아도 아래 단어가 있으면 '확인 후 등록'으로 분류 (띄어쓰기 무시하고 검사)
claim_keywords:
  - 환불
  - 머리카락
  - 이물질
  - 벌레
  - 배탈
  - 식중독
  - 설사
  - 복통
  - 탈났
  - 상했
  - 쉰내
  - 비린
  - 덜익
  - 안익
  - 날것
  - 누락
  - 빠졌
  - 안왔
  - 안와요
  - 식었
  - 눅눅
  - 불친절
  - 위생
  - 실망
  - 최악
  - 다시는
  - 신고

# 욕설/비방 - 발견 시 '확인 후 등록'
abusive_keywords:
  - 씨발
  - 시발
  - ㅅㅂ
  - 병신
  - ㅂㅅ
  - 개같
  - 좆
  - 쓰레기
  - 미친
  - 꺼져
