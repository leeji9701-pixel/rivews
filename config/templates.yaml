# ============================================================
# 답글 템플릿 & 분류 규칙
# 플랫폼이 답글 앞에 '000님,' 을 자동으로 붙이므로 본론부터 작성합니다.
# {order_count} 자리에는 고객의 주문 횟수가 들어갑니다.
# ============================================================

# 위의 템플릿은 기본 브랜드(namsan = 101번지 남산돈까스) 용입니다.
# 다른 브랜드 문구는 맨 아래 brands: 에 있습니다.
default_brand: namsan

# 이 횟수 이상 주문한 고객에게는 'VIP 단골' 템플릿을 사용
vip_min_orders: 3

# 3~5점 + 클레임 키워드 없는 리뷰에 쓰는 템플릿
# 선택 순서: 3점(three_star) -> 단골(vip) -> 사진 리뷰(photo) -> 기본(default)
positive:
  three_star: |-
    101번지 남산돈까스 본점입니다.

    소중한 시간 내어 솔직한 리뷰 남겨주셔서 감사합니다.
    이번 식사가 기대에 온전히 미치지 못한 것 같아 아쉬운 마음입니다. 남겨주신 의견 꼼꼼히 살펴 다음번에는 꼭 만족하실 수 있는 돈까스로 보답하겠습니다.
    다시 한번 찾아주시면 더 나은 모습 보여드릴게요. 감사합니다!

  vip: |-
    안녕하세요! 101번지 남산돈까스 본점입니다.
    무려 {order_count}번째나 저희 매장을 잊지 않고 찾아주신 VIP 단골 고객님께 진심으로 감사드립니다! 보내주신 소중한 신뢰에 보답할 수 있도록 항상 기복 없이 최상의 맛과 품질로 준비하겠습니다. 늘 건강하시고 행복하세요!

  photo: |-
    101번지 남산돈까스 본점입니다.

    저희 매장을 이용해 주시고 소중한 리뷰와 사진까지 남겨주셔서 진심으로 감사드립니다.
    양도 맛도 만족스러운 식사가 되신 것 같아 다행입니다. 앞으로도 언제나 넉넉하고 변함없는 맛으로 보답하겠습니다.
    건강하고 즐거운 하루 보내시길 바랍니다!

  default: |-
    101번지 남산돈까스 본점입니다!

    배달도 빠르게 도착하고 따뜻하고 맛있게 드셨다니 정말 다행입니다. 😊
    정성스러운 소중한 리뷰 감사드리며, 앞으로도 변함없이 맛있는 돈까스로 보답하겠습니다. 즐거운 하루 되세요!

# 이 별점 이하는 자동 답글 없이 '확인 후 등록' (캡처 + 확인대기.xlsx)
manual_max_rating: 2

# ------------------------------------------------------------
# 확인 후 등록 (악성/저별점) - 자동 등록하지 않고 확인대기.xlsx 에 '답글 초안'만 작성
# 별점이 높아도 아래 키워드가 있으면 이쪽으로 분류합니다 (띄어쓰기 무시).
# 여러 유형에 해당하면 위에 있는 유형이 우선입니다.
# ------------------------------------------------------------
claim_categories:
  - name: 건강이상
    keywords: [배탈, 식중독, 설사, 복통, 탈났, 상했, 쉰내]
    reply: |-
      101번지 남산돈까스 본점입니다.

      드시고 불편을 겪으셨다니 정말 죄송하고 무엇보다 고객님의 건강이 걱정됩니다.
      해당 주문 건의 식재료와 조리 과정을 즉시 점검하겠습니다. 번거로우시겠지만 매장으로 연락 주시면 책임지고 확인 및 조치해 드리겠습니다.
      다시 한번 깊이 사과드립니다.

  - name: 이물질/위생
    keywords: [머리카락, 이물질, 벌레, 위생]
    reply: |-
      101번지 남산돈까스 본점입니다.

      음식에 이물질이 들어가 불쾌하셨을 고객님께 진심으로 사과드립니다.
      주방 위생 관리와 조리 과정을 즉시 재점검하여 같은 일이 다시는 없도록 하겠습니다. 매장으로 연락 주시면 해당 주문 건은 책임지고 조치해 드리겠습니다.
      정말 죄송합니다.

  - name: 조리상태
    keywords: [덜익, 안익, 날것, 비린, 눅눅, 식었]
    reply: |-
      101번지 남산돈까스 본점입니다.

      기대하고 주문해 주셨는데 음식 상태가 만족스럽지 못해 정말 죄송합니다.
      말씀해 주신 부분은 조리 시간과 포장 과정을 다시 점검해 바로 개선하겠습니다. 다음번에는 바삭하고 따뜻한 돈까스로 꼭 보답드리겠습니다.

  - name: 누락/배달
    keywords: [누락, 빠졌, 안왔, 안와요]
    reply: |-
      101번지 남산돈까스 본점입니다.

      주문하신 음식을 온전히 받지 못하셔서 많이 불편하셨을 텐데 진심으로 사과드립니다.
      포장 및 출고 단계의 확인 절차를 강화하겠습니다. 매장으로 연락 주시면 누락된 부분은 빠르게 확인하여 조치해 드리겠습니다.

  - name: 서비스
    keywords: [불친절]
    reply: |-
      101번지 남산돈까스 본점입니다.

      응대 과정에서 불편을 드려 진심으로 사과드립니다.
      말씀해 주신 내용은 직원들과 함께 공유하고 교육하여 더 친절한 매장이 되도록 노력하겠습니다.

  - name: 환불요청
    keywords: [환불]
    reply: |-
      101번지 남산돈까스 본점입니다.

      이용에 불편을 드려 정말 죄송합니다.
      매장으로 연락 주시면 주문 내역을 확인한 뒤 신속하게 도와드리겠습니다. 소중한 의견 감사드리며 더 나은 매장이 되도록 노력하겠습니다.

  - name: 불만일반
    keywords: [실망, 최악, 다시는, 신고]
    reply: |-
      101번지 남산돈까스 본점입니다.

      기대에 미치지 못하는 식사를 드려 진심으로 죄송합니다.
      남겨주신 의견을 무겁게 받아들이고 맛과 서비스 전반을 다시 점검하겠습니다. 기회를 주신다면 다음에는 꼭 만족스러운 식사로 보답드리겠습니다.

# 키워드 없이 1~2점이거나 욕설/비방만 있는 경우 쓰는 기본 초안
manual_default_reply: |-
  101번지 남산돈까스 본점입니다.

  만족스러운 식사를 드리지 못해 정말 죄송합니다.
  어떤 점이 불편하셨는지 꼼꼼히 살펴 개선하겠습니다. 다음번에는 더 나은 맛과 서비스로 보답드리겠습니다.

# 욕설/비방 - 발견 시 '확인 후 등록'
abusive_keywords:
  - 씨발
  - 시발
  - ㅅㅂ
  - 병신
  - ㅂㅅ
  - 개같
  - 좆
  - 쓰레기
  - 미친
  - 꺼져

