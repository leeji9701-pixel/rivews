# ============================================================
# 101번지 남산돈까스 리뷰 답글 자동화 - 기본 설정
# ============================================================

# 매일 자동 실행 시간 (HH:MM)
# 직접 고치지 말고 '매일시간변경.bat' 을 실행하면 작업 스케줄러까지 함께 바뀝니다.
schedule_time: "08:30"

# true  = 템플릿 답글을 실제로 등록하지 않고 '처리내역' 엑셀에 초안만 기록 (시험 운영)
# false = 템플릿 답글을 실제로 등록
# ※ 악성·저별점 리뷰는 설정과 관계없이 절대 자동 등록하지 않습니다 (확인대기.xlsx 에 초안만 작성).
dry_run: true

# false = 브라우저 창을 띄워서 작업 (플랫폼 차단 위험이 낮아 권장)
headless: false

# 사용할 브라우저: chrome = PC에 설치된 구글 크롬 (쿠팡이츠 접속 차단 회피에 필요)
# 크롬이 없으면 자동으로 기본 브라우저(Chromium)로 진행합니다. 비워두면 항상 기본 브라우저.
browser_channel: chrome

# 계정당 한 번에 등록할 최대 답글 수
max_replies_per_account: 50

# 동작 사이 대기 시간(초) 범위 - 너무 빠르면 자동화로 의심받을 수 있어요
delay_seconds: [2, 5]

folders:
  captures: 악성리뷰        # 악성 리뷰 캡처: 악성리뷰/2026-09-28/...png
  reports: 처리내역         # 매일 처리 결과: 처리내역/2026-09-28.xlsx
  pending_file: 확인대기.xlsx  # 악성·저별점 리뷰 + 답글 초안 (검수 후 직접 등록)

# 계정 목록 - env_prefix 는 .env 의 변수 이름 앞부분과 같아야 합니다.
# name 은 보기 편하게 매장명 등으로 바꿔도 됩니다.
# 매장마다 리뷰 페이지 주소가 다르면 reviews_url: "https://..." 를 추가하세요.
accounts:
  - platform: baemin
    name: 배민_계정1
    env_prefix: BAEMIN_1
  - platform: baemin
    name: 배민_계정2
    env_prefix: BAEMIN_2
  - platform: baemin
    name: 배민_계정3
    env_prefix: BAEMIN_3
  - platform: coupangeats
    name: 쿠팡_계정1
    env_prefix: COUPANG_1
  - platform: coupangeats
    name: 쿠팡_계정2
    env_prefix: COUPANG_2
  - platform: coupangeats
    name: 쿠팡_계정3
    env_prefix: COUPANG_3

# 한 계정으로 여러 매장(브랜드)을 운영하는 경우
# 아이디가 id_prefix 로 시작하는 계정은 아래 매장들을 하나씩 선택해 각각 답글을 답니다.
# brand 는 config/templates.yaml 의 브랜드 이름 (namsan = 101번지 남산돈까스, gagasotbap = 가가솥밥)
# store_id 가 있으면 매장 번호로, 없으면 매장 이름으로 찾아 선택합니다.
multi_store_accounts:
  - id_prefix: gaga
    stores:
      - name: 101번지 남산돈까스
        brand: namsan
      - name: 가가솥밥
        brand: gagasotbap
        store_id: "14928762"
